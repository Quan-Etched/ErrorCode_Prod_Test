# L10 cable inventory (CheckCable). The check records these codes in the order
# they are listed here and a run reports the earliest one it recorded, so a
# failing run carries a single code. One bad port can still record more than
# one: a port dropped by NIC_PORT_INTERFACE_MISSING or
# CABLE_MODULE_INFO_INCOMPLETE never reaches position checking, so if the BOM
# declares a cable at its position that position also records
# CABLE_MISSING_AT_POSITION, naming the dropped port as the cause. A
# precondition failure that stops the check before any cable is reached (no SSH
# target, no cables in the BOM, netd unreachable) reports TH-HAR-0003 instead:
# nothing NIC-specific was checked.
# Allocated from 0036 in the 1X registry before CheckCable had an L10 registry
# to live in; the identities are unchanged.
- error_code: TH-NIC-0036
  name: NIC_PORT_INTERFACE_MISSING
  version: 1
  category: 1  # CATEGORY_NETWORK
  severity: 4  # ERROR_TRIAGE
  quick_action: 9  # QA_ESCALATE -- retry cannot bind a driver
  component: L10.NIC.PORT
  test_cases: [CheckCable]
  disposition: FAILED
  retryable: false
  max_auto_retry: 0
  description: >
    netd reported a NIC port with no kernel interface name, so ethtool cannot
    read that port's module EEPROM and the cable there cannot be verified.
  probable_causes:
    - NIC function present on the bus but no netdev created (driver not bound)
    - NIC firmware or driver failed to bring the port up
    - Port renamed or removed on the host outside the harness
  capture:
    - suite_run_url
    - netd GetNics response for the affected port (bdf, position)
    - ip link and lspci output for the NIC
    - unit_sn, bios/fw_version, harness_version, station_id, operator_id, timestamp
  repair_actions:
    - {step: 1, who: operator, action: "Collect the suite/test logs and artifacts for this failure.", est_time_min: 5}
    - {step: 2, who: escalate, action: "Escalate to Etched engineer with the collected logs.", ticket_template: ETCH}
  owner: supercomputing-sw
  doc_url: https://docs.google.com/document/d/1-_YC_cXvi3FtKd51jIetY9pER8JtCxH5dBE9UvndZWU/edit
  since: harness 2026.224
  suspected_components: [NIC, NIC_DRIVER]
  vendor_error_id: []
  jira_component: ETCH / l10-test

# Both halves of this group leave the check without the data it needs to judge a
# module, so they share one code: an unusable position identifier from netd, and
# an EEPROM that omits a required identity field.
