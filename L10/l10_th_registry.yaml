  name: CABLE_MODULE_INFO_INCOMPLETE
  version: 1
  category: 11  # CATEGORY_DATA
  severity: 4  # ERROR_TRIAGE
  quick_action: 9  # QA_ESCALATE
  component: L10.NIC.CABLE
  test_cases: [CheckCable]
  disposition: FAILED
  retryable: false
  max_auto_retry: 0
  description: >
    A pluggable module was read but cannot be checked: netd gave its port no
    position identifier or one outside the known layout, or the module did not
    report every identity field the check requires.
  probable_causes:
    - Corrupt or non-compliant module EEPROM omitting Vendor PN/SN or Identifier
