# L10 TH error-code registry (TH Error Code Specification v0.3 §7, §11.1).
# Source of truth for codegen once CI lands; l10_error_codes.py must stay in
# sync (l10_error_codes_test enforces it).
#
# Identity segments (e.g. TH-CPU-0001) are immutable: never renumber, never
# reuse. A change of meaning requires a new code.
#
# TH-CPU-0002 (CPU_STRESS_PERF_BELOW_THRESHOLD) is reserved but NOT allocated:
# CpuStress has no performance-threshold exit today. Allocate it only when
# such a check is added.
#
# Catalog: L10_error_codes.csv. Packed form is Domain|Category|Severity|
# QuickAction|sequence (spec §2.2). L10 may reuse a 1X identity only when
# the ErrorCodeDef is identical; a different name or disposition needs a
# new code. l10_error_codes_test enforces that across catalogs.
#
# ETCH-39238
- error_code: TH-BIOS-0001
  name: BIOS_EXPECTED_CONFIG_UNAVAILABLE
  version: 1
  category: 5  # CATEGORY_CONFIG
  severity: 5  # ERROR_CONFIG
  quick_action: 9  # QA_ESCALATE
  component: L10.BIOS.BIOS
  test_cases: [CheckBiosVersion, CheckBiosBootOrder]
  disposition: ERROR
  retryable: false
  max_auto_retry: 0
  description: >
    Expected BIOS version or boot-order configuration could not be loaded; no
    BIOS verdict is available.
  probable_causes:
    - "Test-system, station, or configuration problem covering BIOS"
    - "Missing, malformed, or unreachable input required by BIOS_EXPECTED_CONFIG_UNAVAILABLE"
    - Suite or image provisioning gap rather than a DUT hardware fault
  capture:
    - suite_run_url
    - "failing test case(s): CheckBiosVersion, CheckBiosBootOrder"
    - per-test log and transcript
    - "unit_sn, bios/fw_version, harness_version, station_id, operator_id, timestamp"
  repair_actions:
    - {step: 1, who: "engineer", action: "Fix the station, image, or suite configuration; do NOT route the unit to rework.", retest: "affected_subset", est_time_min: 15, ticket_template: "ETCH"}
  owner: supercomputing-sw
  doc_url: https://docs.google.com/document/d/1-_YC_cXvi3FtKd51jIetY9pER8JtCxH5dBE9UvndZWU/edit
  since: harness 2026.226
  suspected_components: [BIOS]
  vendor_error_id: []
  jira_component: ETCH / l10-test
