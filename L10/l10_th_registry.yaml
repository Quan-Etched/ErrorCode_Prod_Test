  version: 1
  category: 5  # CATEGORY_CONFIG
  severity: 4  # ERROR_TRIAGE
  quick_action: 9  # QA_ESCALATE
  component: L10.NIC.PORT
  test_cases: [CheckCable]
  disposition: ERROR  # test-system problem; excluded from server yield
  retryable: false
  max_auto_retry: 0
  description: >
    More than one module reported the same port position, so the check cannot
    tell which one is physically there and prunes all of them rather than
    guessing.
  probable_causes:
    - netd port-position mapping assigns one position to several BDFs
    - Server layout changed without a matching netd configuration update
