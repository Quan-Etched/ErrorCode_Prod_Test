    wrapper never mints this code for an inner suite that ran and failed.
    Unpopulated chip slots on SltModuleNestedTestCase remain SKIP (not
    this code).
  probable_causes:
    - Suite configuration or resource wiring error in the nested wrapper
    - Child suite could not be launched at all
    - Container runtime / image load or inner harness API failure
  capture:
    - suite_run_url
