# Host-side setup steps (module reload, PCIe teardown, Kayak RAID remount,
# sysfs driver parameters, log-reader activation) run against the station
# host, not the module: a failure says nothing about the DUT, so disposition
# ERROR keeps it out of module yield.
- error_code: TH-ENV-0004
  name: HOST_SETUP_STEP_FAILED
  version: 1
  category: 5  # CATEGORY_CONFIG
  severity: 4  # ERROR_TRIAGE
  quick_action: 9  # QA_ESCALATE
  component: 1X.ENV.HOST_SETUP
  test_cases: [ReloadKernelModuleTestCase, PcieTeardownTestCase, PcieRescanTestCase, SetSkipFlrOnOpenCloseTestCase, SohuLogReaderActivateTestCase, LogReaderCaptureTestCase, PublishBootloaderTypeTestCase, KayakRaidRemountTestCase]
  disposition: ERROR  # station host environment problem; excluded from DUT yield
  retryable: false
  max_auto_retry: 0
  description: >
    A host driver/setup utility step failed: a kernel module reload, PCIe
    teardown or bus rescan, Kayak RAID remount, sohu_mdev sysfs parameter write,
    or log-reader activation returned non-zero on the station host.
  probable_causes:
    - sohu_mdev kernel module not loaded, or loaded at a version without the expected parameter
    - Missing sudo/permissions for the setup command on the station host
    - Earlier setup step in the suite failed and left the host in an unexpected state
    - Host tooling (driver package, log reader) not provisioned on this station
    - /sys/bus/pci/rescan write failed
    - Kayak RAID0 at /data/kayak failed to reassemble or remount after PEX teardown
  capture:
    - suite_run_url
    - exact command, exit code, stdout and stderr of the failing setup step
    - lsmod / modinfo output for sohu_mdev
    - dmesg excerpt for the run window
    - harness_version, station_id, operator_id, timestamp
  repair_actions:
    - {step: 1, who: operator, action: "Collect the suite/test logs and artifacts for this failure.", est_time_min: 5}
    - {step: 2, who: escalate, action: "Escalate to Etched engineer with the collected logs. DO NOT retest.", ticket_template: ETCH}
  owner: supercomputing-sw
  doc_url: https://github.com/etched-ai/sw/blob/master/host/system_test/error_codes/doc/ReloadKernelModuleTestCase.md#TH-ENV-0004
  since: harness 2026.216
  suspected_components: []
  vendor_error_id: []
  jira_component: ETCH / 1x-module-test
- error_code: TH-HAR-0001
  name: TEST_TIMEOUT
  version: 1
  category: 7  # CATEGORY_SOFTWARE — harness-terminated; DUT hang not proven
  severity: 4  # ERROR_TRIAGE — needs engineering disposition
  quick_action: 0  # QA_NO_ACT — preserve state; reboot/retry decisions are human
  component: L10.HAR.HARNESS
  test_cases: []  # harness-level; applies to any test case
  disposition: ABORTED  # run stopped before a verdict
  retryable: false
  max_auto_retry: 0
  description: >
    A test case exceeded its configured timeout and was terminated by the
    harness before producing a verdict.
  probable_causes:
    - DUT hang or severe slowdown under the test workload
    - Test timeout configured too low for this platform
    - Harness/executor stall (e.g. remote connection loss)
  capture:
    - suite_run_url
    - per-test log and transcript
    - configured timeout and measured duration
    - harness_version, station_id, operator_id, timestamp
  repair_actions:
    - {step: 1, who: operator, action: "Rerun the affected subset once to check reproducibility.", retest: affected_subset, est_time_min: 10}
    - {step: 2, who: escalate, action: "Route to engineering triage with the per-test log and timeout configuration.", retest: n/a, ticket_template: ETCH}
  owner: supercomputing-sw
  doc_url: https://github.com/etched-ai/sw/blob/master/host/system_test/error_codes/doc/Harness.md#TH-HAR-0001
  since: harness 2026.216
  suspected_components: []
  vendor_error_id: []
  jira_component: ETCH / l10-test

# Test invoked with invalid/unsupported arguments: a suite-configuration
# problem, not a DUT verdict.
- error_code: TH-HAR-0002
  name: TEST_ARGS_INVALID
  version: 1
  category: 5  # CATEGORY_CONFIG
  severity: 5  # ERROR_CONFIG — resolvable by fixing the suite configuration
  quick_action: 9  # QA_ESCALATE — retry cannot fix a config error
  component: L10.HAR.HARNESS
  test_cases: [SohuSecureBootRecoveryUpdateTestCase, ServerNestedTestCase, SohuSnapTestCase, VfioProxyVersionTestCase, SohuWeightLoadTestCase, SltModuleNestedTestCase]  # reusable by any test that validates args
  disposition: ERROR  # suite-config problem; excluded from DUT yield
  retryable: false
  max_auto_retry: 0
  description: >
    A test case was invoked with invalid or unsupported arguments (e.g.
    unexpected kwargs, unsupported mode) and rejected the run before
    touching the DUT.
  probable_causes:
    - Suite YAML passes arguments the test does not accept
    - Suite YAML requests a mode/path the test does not support
  capture:
    - suite_run_url
    - the offending args from the per-test log
    - harness_version, station_id, timestamp
  repair_actions:
    - {step: 1, who: engineer, action: "Fix the suite YAML for this test; do not route the unit to rework"}
  owner: supercomputing-sw
  doc_url: https://github.com/etched-ai/sw/blob/master/host/system_test/error_codes/doc/SohuSecureBootRecoveryUpdateTestCase.md#TH-HAR-0002
  since: harness 2026.216
  suspected_components: []
  vendor_error_id: []
  jira_component: ETCH / l10-test

# A tool, binary, or data file the test depends on is missing on the test
# system: a deployment/provisioning gap, not a DUT verdict.
- error_code: TH-HAR-0003
  name: TEST_DEPENDENCY_UNAVAILABLE
  version: 1
  category: 5  # CATEGORY_CONFIG — deployment/provisioning gap
  severity: 5  # ERROR_CONFIG — resolvable by fixing the deployment
  quick_action: 9  # QA_ESCALATE — retry cannot materialize a missing file
  component: L10.HAR.HARNESS
  test_cases: [SohuSecureBootRecoveryUpdateTestCase, SohuWeightLoadTestCase, VbbFirmwareUpdateTestCase]  # reusable by any test with external dependencies
  disposition: ERROR  # test-system problem; excluded from DUT yield
  retryable: false
  max_auto_retry: 0
  description: >
    A tool, binary, or data file the test depends on (e.g. the pldm_ua
    binary) is missing on the test system, so the test could not perform
    its function. Distinct from TH-CPU-0003, which covers a tool missing
    on the DUT. Also covers missing VBB flash runfiles / nm toolchain /
    version_info artifacts for fixture firmware update and chipsim
    /mnt/weights 9p mount failure for Kayak workloads that never start.
  probable_causes:
    - Test package/runfiles deployment gap on the station
    - Harness release missing a data dependency
  capture:
    - suite_run_url
    - the missing path from the per-test log
    - harness_version, station_id, timestamp
  repair_actions:
    - {step: 1, who: engineer, action: "Fix the station deployment / harness package; do not route the unit to rework"}
  owner: supercomputing-sw
  doc_url: https://github.com/etched-ai/sw/blob/master/host/system_test/error_codes/doc/SohuSecureBootRecoveryUpdateTestCase.md#TH-HAR-0003
  since: harness 2026.216
  suspected_components: []
  vendor_error_id: []
  jira_component: ETCH / l10-test
