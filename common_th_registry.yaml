# Common TH error-code registry (TH Error Code Specification v0.3 §7, §11.1).
# Source of truth for codegen once CI lands; common_error_codes.py must stay
# in sync (common_error_codes_test enforces it).
#
# Identity segments (e.g. TH-HAR-0001) are immutable: never renumber, never
# reuse. A change of meaning requires a new code.
#
# Scope: codes that are not owned by a single station -- harness-level
# TH-HAR codes, station host/fixture TH-ENV codes, shared Ethernet configuration
# codes, and the station PSU code shared by SLT and 1X module testing.
# Station-specific codes belong in th_registry.yaml (1X module test) or
# L10/l10_th_registry.yaml.
#
# A record here may also appear in a station registry while that station's
# consumers are being drained; the ErrorCodeDef must be identical.
# catalog_consistency_test enforces that across catalogs.
- error_code: TH-C2C-0010
  name: C2C_CONFIG_REQUEST_FAILED
  version: 1
  category: 7  # CATEGORY_SOFTWARE
  severity: 4  # ERROR_TRIAGE
  quick_action: 9  # QA_ESCALATE
  component: C2C.SOHU_SERDES
  test_cases: [C2cConfigureMultiChipTestCase]
  disposition: ERROR
  retryable: false
  max_auto_retry: 0
  description: >
    Firmware rejected the Ethernet configuration request or the configuration
    helper received a non-OK firmware status. No FLR is attempted;
    earlier chips may already have stored the override.
  probable_causes:
    - Firmware rejected or could not store the requested MAC/PHY configuration
    - Host and firmware configuration support differs
  capture:
    - suite_run_url
    - Requested FEC mode and failing device index from the test message
    - Per-test log with the full configuration exception traceback
    - "unit_sn, fw_version, harness_version, station_id, timestamp"
  repair_actions:
    - {step: 1, who: "engineer", action: "Inspect the firmware status and host/firmware compatibility; common-reset the tray before retrying to clear partially stored overrides.", retest: "affected_subset", ticket_template: "ETCH"}
  owner: supercomputing-sw
  doc_url: ""
  since: unreleased
  suspected_components: [SOHU_FIRMWARE]
  vendor_error_id: []
  jira_component: ETCH / l10-test
- error_code: TH-C2C-0011
  name: C2C_CONFIG_FLR_FAILED
  version: 1
  category: 7  # CATEGORY_SOFTWARE
  severity: 4  # ERROR_TRIAGE
  quick_action: 9  # QA_ESCALATE
  component: C2C.SOHU_SERDES
  test_cases: [C2cConfigureMultiChipTestCase]
  disposition: ERROR
  retryable: false
  max_auto_retry: 0
  description: >
    All Ethernet override requests were stored, but the FLR helper returned an
    error while applying them. FEC readback was not attempted, so the requested
    configuration is unverified and this code alone does not diagnose hardware.
  probable_causes:
    - RPC proxy or PCIe reset operation failed
    - Firmware did not become pingable within the post-FLR recovery timeout
  capture:
    - suite_run_url
    - Requested FEC mode, failing device index, and FLR helper error from the test message
    - Per-test log and RPC proxy diagnostics
    - "unit_sn, fw_version, harness_version, station_id, timestamp"
  repair_actions:
    - {step: 1, who: "engineer", action: "Inspect the FLR error, proxy health, and firmware recovery; common-reset the tray before rerunning configuration and link validation.", retest: "affected_subset", ticket_template: "ETCH"}
  owner: supercomputing-sw
  doc_url: ""
  since: unreleased
  suspected_components: [RPC_PROXY, SOHU_FIRMWARE, PCIE]
  vendor_error_id: []
  jira_component: ETCH / l10-test
- error_code: TH-C2C-0012
  name: C2C_CONFIG_READBACK_MISMATCH
  version: 1
  category: 5  # CATEGORY_CONFIG
  severity: 4  # ERROR_TRIAGE
  quick_action: 9  # QA_ESCALATE
  component: C2C.SOHU_SERDES
  test_cases: [C2cConfigureMultiChipTestCase]
  disposition: FAILED
  retryable: false
  max_auto_retry: 0
  description: >
    After storing the override and completing FLR, one or more datalink pairs
    reported an unset FEC mode or a mode different from the requested value.
    All readback mismatches are included in the test message. This proves a
    configuration mismatch, not a link-quality or hardware failure.
  probable_causes:
    - Firmware did not apply the requested mode to every datalink pair
    - A reset or another configuration request replaced the override
  capture:
    - suite_run_url
    - Device index, datalink pair, expected mode, and actual mode from the test message
    - Per-test log and firmware version
    - "unit_sn, harness_version, station_id, timestamp"
  repair_actions:
    - {step: 1, who: "engineer", action: "Compare expected and actual modes, inspect firmware configuration application and competing resets, then rerun configuration and link validation.", retest: "affected_subset", ticket_template: "ETCH"}
  owner: supercomputing-sw
  doc_url: ""
  since: unreleased
  suspected_components: [SOHU_FIRMWARE]
  vendor_error_id: []
  jira_component: ETCH / l10-test

# Allocation only: the sheet lists host_boot against this row, but no such test
# case exists in the harness yet. Emission lands with that test case; the code is
# allocated now so the identity is reserved and the SOP is reviewable.
- error_code: TH-ENV-0001
  name: HOST_NOT_REACHABLE_AFTER_BOOT
  version: 1
  category: 1  # CATEGORY_NETWORK
  severity: 4  # ERROR_TRIAGE
  quick_action: 9  # QA_ESCALATE -- retry cannot fix station cabling
  component: 1X.ENV.STATION_HOST
  test_cases: []  # host_boot not yet implemented in the harness
  disposition: ERROR  # test-system problem; excluded from module yield
  retryable: false
  max_auto_retry: 0
  description: >
    The station host or its BMC did not answer ping or SSH after boot, so no
    module test could start. This is a test-system condition, not a module
    verdict.
  probable_causes:
    - Station host powered off or stuck before the OS came up
    - BMC network or management cabling fault
    - sshd not running or host key changed on the station host
    - Station host IP/DHCP reservation changed
  capture:
    - suite_run_url
    - ping and ssh transcript for the station host and its BMC
    - station_id, harness_version, operator_id, timestamp
  repair_actions:
    - {step: 1, who: operator, action: "Connect a monitor to the Devkit and verify that the system boots successfully, then try ping with host / BMC."}
    - {step: 2, who: operator, action: "Collect the suite/test logs and artifacts for this failure.", est_time_min: 5}
    - {step: 3, who: escalate, action: "Escalate to Etched engineer with the collected logs.", ticket_template: ETCH}
  owner: supercomputing-sw
  doc_url: https://github.com/etched-ai/sw/blob/master/host/system_test/error_codes/doc/Harness.md#TH-ENV-0001
  since: harness 2026.216
  suspected_components: []
  vendor_error_id: []
  jira_component: ETCH / MLT
