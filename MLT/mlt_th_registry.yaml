# TH-THM-0001 identity is pre-allocated in the legacy _Etched Error Code
# sheet (1X Module Test tab): keep it verbatim. Its packed form equals
# TH-CPU-0001's (spec §2.2 does not encode the subsystem); join on the
# identity segments, never on packed alone.
- error_code: TH-THM-0001
  name: THERMAL_READING_OUT_OF_RANGE
  version: 1
  category: 6  # CATEGORY_HARDWARE
  severity: 2  # ERROR_ISOLATE
  quick_action: 6  # QA_RETRY, falls back to QA 9 on budget exhaustion
  component: MLT.THM.SOHU_CHIP  # 1X Module Test (MLT) station
  test_cases: [SohuThermalDiodeTestCase, SohuDtsTestCase]
  disposition: FAILED
  retryable: true
  max_auto_retry: 1
  description: >
    Thermal diode temperature reading out of the qualified range, reported
    invalid by the sensor, or an uncalibrated mezzanine diode reading below
    0 C (bad solder joint indicator). Failing channels go in the message /
    affected_instances, never into new codes (spec §1.2).
  probable_causes:
