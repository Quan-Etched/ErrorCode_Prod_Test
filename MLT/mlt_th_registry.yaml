# 1X module (SLT) code.
#
# No retry: defects exceed lane-repair coverage, so a rerun cannot find a
# repair that does not exist. The stack is unrepairable and the decision is a
# human screen-out. Incomplete / aborted sweeps (repairability unknown) are
# TH-HBM-0008 (ERROR), not this code.
- error_code: TH-HBM-0006
  name: HBM_LANE_REPAIR_FAILED
  version: 1
  category: 3  # CATEGORY_MEMORY
  severity: 2  # ERROR_ISOLATE — module cannot be trusted for workload
  quick_action: 9  # QA_ESCALATE
  component: 1X.HBM.STACK
  test_cases: [SohuLaneRepairTestCase]
  disposition: FAILED
  retryable: false
  max_auto_retry: 0
  description: >
    Lane repair established that one or more HBM pseudo-channels cannot be
    repaired within spare coverage. Covers a completed sweep with per-target
    errors (fail_fast=False), and fail_fast raises that prove unrepairability
    (exhausted candidate byte pairs, multi-bit / aword / DWORD LFSR
    unrepairable, or applied repairs still failing verification). Distinct
    from TH-HBM-0008, which covers an aborted sweep where repairability was
    never established (RPC / firmware / setup).
  probable_causes:
    - More failing lanes on the pseudo-channel than there are spares
    - HBM stack or interposer defect beyond lane-repair coverage
    - Sohu HBM PHY fault on the affected channel
  capture:
    - suite_run_url
    - hbm_lane_repairs JSON artifact (per-target repair map)
