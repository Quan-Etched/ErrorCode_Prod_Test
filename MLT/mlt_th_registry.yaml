# MLT (1X module test) TH error-code registry (TH Error Code Specification
# v0.3 §7, §11.1). Source of truth for codegen once CI lands;
# mlt_error_codes.py must stay in sync (mlt_error_codes_test enforces it).
#
# Identity segments (e.g. TH-SOHU-0001) are immutable: never renumber, never
# reuse. A change of meaning requires a new code.
#
# Scope: the chip/module station. Cross-station codes (TH-HAR, TH-ENV, the
# station PSU code) live in ../common_th_registry.yaml and the L10 server
# station owns ../L10/l10_th_registry.yaml. A record may also appear in
# ../th_registry.yaml while the tests/chip consumers are drained onto this
# catalog; the ErrorCodeDef is identical and catalog_consistency_test
# enforces that.
#
# Retired records (retired: true) stay here for historical resolution and
# must not be re-added to the enum.
- error_code: TH-C2C-0001
  name: C2C_LINKUP_FAILED
  version: 1
  category: 6  # CATEGORY_HARDWARE
  severity: 2  # ERROR_ISOLATE
  quick_action: 9  # QA_ESCALATE
  component: 1X.C2C.SOHU_SERDES
  test_cases: [C2cLinkupTestCase, C2cLinkupMultiChipTestCase, C2cThroughputTestCase, C2cThroughputMultiChipTestCase]
  disposition: FAILED
  retryable: false
  max_auto_retry: 0
  description: >
    C2C lanes failed to train or link up within the timeout: RX equalization
    did not converge after its configured attempts, or the link-up test
    reported one or more datalinks/lanes down.
  probable_causes:
    - Marginal SERDES TX/RX lane on the module
    - FIR taps from the preceding sweep not valid for this rate/FEC mode
    - Loopback fixture or cable not seated on the station
    - PHY configuration mismatch for the requested FEC mode
  capture:
    - suite_run_url
    - link-up test output directory (per-lane PoR summary)
    - affected datalinks/lanes in affected_instances
    - fec_mode, phy_loopback_mode and mac_loopback flag for the run
    - unit_sn, bios/fw_version, harness_version, station_id, operator_id, timestamp
  repair_actions:
    - {step: 1, who: operator, action: "Collect the suite/test logs and artifacts for this failure.", est_time_min: 5}
    - {step: 2, who: escalate, action: "Escalate to Etched engineer with the collected logs.", ticket_template: ETCH}
  owner: supercomputing-sw
  doc_url: https://github.com/etched-ai/sw/blob/master/host/system_test/error_codes/doc/C2cLinkupTestCase.md#TH-C2C-0001
  since: harness 2026.216
  suspected_components: [SOHU_SERDES, C2C_LOOPBACK_FIXTURE]
  vendor_error_id: []
  jira_component: ETCH / MLT
