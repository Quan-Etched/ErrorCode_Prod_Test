# Secure-boot recovery update codes (PLDM path): the sheet renumbered the
# recovery-fail row to TH-FW-0008 after 0006 was taken by the DVFS row.
- error_code: TH-FW-0008
  name: SECURE_BOOT_RECOVERY_UPDATE_FAIL
  version: 1
  category: 5  # CATEGORY_CONFIG — FW subsystem default (spec §3)
  severity: 2  # ERROR_ISOLATE
  quick_action: 6  # QA_RETRY
  component: MLT.FW.SOHU_CHIP  # 1X Module Test (MLT) station, not L10
  test_cases: [SohuSecureBootRecoveryUpdateTestCase]
  disposition: FAILED
  retryable: true
  max_auto_retry: 1  # rerun once only - further retries can leave the device mid-update
  description: >
    The VFIO app firmware update through secure-boot recovery mode failed -
    the recovery strap sequence failed or the PLDM Update Agent reported an
    update failure (non-zero pldm_ua exit, update rejected by the device).
    Tooling/deployment gaps are TH-HAR-0003; invalid args are TH-HAR-0002.
  probable_causes:
    - Device did not enter or hold secure-boot recovery mode (strap/VBB issue)
    - PLDM package rejected by the device (image/signature mismatch)
    - Sohu UART communication errors during the update
  capture:
    - suite_run_url
