- error_code: TH-FW-0001
  name: SOHU_FIRMWARE_UPDATE_FAILED
  version: 1
  category: 5  # CATEGORY_CONFIG
  severity: 2  # ERROR_ISOLATE
  quick_action: 9  # QA_ESCALATE -- capture UART before any further action
  component: 1X.FW.SOHU_APP_FIRMWARE
  test_cases: [SohuFirmwareUpdateTestCase, SohuHotReloadFirmwareUpdateTestCase, SohuSecureBootRecoveryUpdateTestCase]
  disposition: FAILED
  retryable: false
  max_auto_retry: 0
  description: >
    The Sohu application firmware update did not complete: loading or executing
    the image package raised, the ASIC did not become pingable afterwards, or
    the ASIC came back without reporting application firmware. For the
    hot-reload case it also covers the pre-update eligibility outcomes, where
    nothing was flashed at all — the chip is running a legacy bootloader, is in
    bootloader mode with no application PLDM endpoint, or the precheck could not
    read the running versions over RPC/proxy.
  probable_causes:
    - Image package rejected by the bootloader (bad signature or layout)
    - ASIC hung during the jump to application firmware
    - Mezzanine/VBB comms lost mid-update
    - Suite ran the hot reload before secure_bootloader and an application firmware were in place
    - Power sequencing fault during the update
  capture:
    - suite_run_url
    - mezz and VBB UART logs across the update window
    - version info before the update
    - image package path and release id
    - unit_sn, bios/fw_version, harness_version, station_id, operator_id, timestamp
  repair_actions:
    - {step: 1, who: operator, action: "Collect the suite/test logs and artifacts for this failure.", est_time_min: 5}
    - {step: 2, who: escalate, action: "Escalate to Etched engineer with the collected logs.", ticket_template: ETCH}
  owner: supercomputing-sw
