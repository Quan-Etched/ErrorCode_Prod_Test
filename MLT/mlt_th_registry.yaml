# Safety-protection path failure: the CTS is the last line of defence against
# a thermal runaway, so the unit is preserved for FA instead of retried,
# even though the code's category is HARDWARE.
- error_code: TH-THM-0003
  name: CTS_PROTECTION_NO_SHUTDOWN
  version: 1
  category: 6  # CATEGORY_HARDWARE
  severity: 2  # ERROR_ISOLATE
  quick_action: 9  # QA_ESCALATE
  component: 1X.THM.CTS
  test_cases: [SohuCtsTestCase]
  disposition: FAILED
  retryable: false
  max_auto_retry: 0
  description: >
    The CTS trim code was driven to its maximum (lowest trip threshold) but
    the chip did not shut down: the CPLD cattrip latch bit in ASIC_CTRL1 was
    never set within the shutdown timeout.
  probable_causes:
    - Defective catastrophic trip sensor on the die (never asserts CATTRIP)
    - CATTRIP output pin or its mezzanine card trace open
    - CATTRIP masked on the mezzanine card CPLD (mcu_cattrip_mask misconfigured)
  capture:
    - suite_run_url
    - CPLD register dump (ASIC_CTRL1, man_mcu_cattrip, mcu_cattrip_mask) from the run
    - cpld_asic_ctrl1 and cattrip_latched measurements
    - VBB serial transcript for the trigger and poll window
    - unit_sn, fw_version, harness_version, station_id, operator_id, timestamp
  repair_actions:
    - {step: 1, who: operator, action: "Collect the suite/test logs and artifacts for this failure.", est_time_min: 5}
    - {step: 2, who: escalate, action: "Escalate to Etched engineer with the collected logs.", ticket_template: ETCH}
